[package]
name = "waultnet-core"
version = "0.1.0"
edition = "2024"
authors = ["Waultnet Collective"]
description = "A decentralized, permissionless protocol for general-purpose high-performance computing."
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
sha3 = "0.10"

[profile.release]
lto = true
opt-level = 3
panic = 'abort'